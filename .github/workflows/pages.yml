# Veröffentlicht die Website im Ordner site/ über GitHub Pages (Suchmaschinen-Seite von steuy).
# Einmalig nötig (Repo-Admin): Settings → Pages → Source: "GitHub Actions". Danach diesen
# Workflow einmal von Hand starten (Actions → Website veröffentlichen → Run workflow) und in
# Settings → Secrets and variables → Actions → Variables PAGES_AKTIV=true setzen, damit jede
# Änderung an site/ automatisch veröffentlicht wird.
name: Website veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PAGES_AKTIV == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
