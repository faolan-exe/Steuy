[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = never
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /dev/stdout
   max log size = 0
   log level = 1
   # Protokoll-Einstellung wird von der App gesteuert (Einstellungen → Scanner)
   include = /etc/samba/protokoll.conf

[scan]
   comment = steuy Scan-Eingang
   path = /scan
   valid users = scanner
   force user = steuy
   force group = steuy
   read only = no
   browseable = no
   guest ok = no
   create mask = 0644
   directory mask = 0755
   follow symlinks = no
   wide links = no
