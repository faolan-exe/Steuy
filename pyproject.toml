[project]
name = "steuy"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
version = "0.6.0"
description = "Selbst gehostete Buchhaltungssoftware und Rechnungsprogramm für Kleinunternehmer und Kleingewerbe (§ 19 UStG, EÜR)"
keywords = ["buchhaltung", "kleinunternehmer", "kleingewerbe", "rechnungsprogramm", "rechnungswesen", "eür", "self-hosted", "accounting", "invoicing", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Framework :: Flask",
    "Natural Language :: German",
    "Topic :: Office/Business :: Financial :: Accounting",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "weasyprint>=70.0",
    "segno>=1.6.6",
    "defusedxml>=0.7.1",
    "pypdf>=6.21.2",
    "pytesseract>=0.3.13",
    "pypdfium2>=5.14.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "gunicorn>=23.0",
]

[project.urls]
Homepage = "https://faolan-exe.github.io/Steuy/"
Demo = "https://steuy.philsit.de"
Source = "https://github.com/faolan-exe/Steuy"
Documentation = "https://github.com/faolan-exe/Steuy/blob/main/docs/faq.md"
Issues = "https://github.com/faolan-exe/Steuy/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
